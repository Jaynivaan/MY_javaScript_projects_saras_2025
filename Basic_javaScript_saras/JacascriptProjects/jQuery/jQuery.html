<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Basic jQuery</title>
        <!--jquery cDN-->
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.0/jQuery.min.js"></script>
    </head>
    
    <body>
        <div id="container">
            <h1>Basic jQuery</h1>

            <p id="p1">Paragraph 1</p>
            <p id="p2">Paragraph 2</p>
            <p id="p3">Paragraph 3</p>

        </div>

        <script>
            $(document).ready(function(){

                //change paragraph 2 color
                $("#p2").css("color","red");

                //hide heading when paragraph 3 is clicked..
                $("#p3").click(function(){
                    $("h1").hide();
                });
            });
        </script>
    </body>
</html>
