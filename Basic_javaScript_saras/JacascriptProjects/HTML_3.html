<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Data Attribute demo</title>
        <script src="JavaScript/JavaScript_3.js" defer></script>
        <link rel="stylesheet" type="text/css" href="CSS/CSS_2.css"/>
    </head>

    <body>
        <h2>lesson data Attribute</h2>
        <details>
            <ul>
                <li onclick="showPractice(this)" 
                    data-phase = "fumigation"
                    data-shadow = "nicotine"
                    data-god = "ganesha" 
                    data-ritual = "breath"
                    data-intensity = "2"
                    data-duration = "5"
                    data-boon = "grounded clarity"> 
                    5-Minute Ganapathy breath before first cigarette 
                </li>
                <li onclick="showPractice(this)"
                    data-phase="awakening"
                    data-shadow="self-doubt"
                    data-god="skanda"
                    data-ritual=""="journal"
                    data-intensity="3"
                    data-duration="11"
                    data-boon="fearless honesty">
                    Skanda truth-journal: "Where am I pretending?"
                </li>
                <li onclick="showPractice(this)"
                    data-phase="enlightenment"
                    data-shadow="ego"
                    data-god="narayana"
                    data-ritual="seva"
                    data-intensity="4"
                    data-duration="15"
                    data-boon="silent compassion">
                    Anonymous act of kindness today
                </li>
            </ul>
        </details>
        <p id="output"></p>
    </body>


</html>
